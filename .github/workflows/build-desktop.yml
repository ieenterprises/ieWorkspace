name: Build and Release ieWorkspace Desktop & Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v0.9.4)'
        required: false
        default: 'v0.9.4'

permissions:
  contents: write

env:
  UPSTREAM_RELEASE: v0.9.4
  UPSTREAM_BASE: https://github.com/leag1234/elixiroffice/releases/download/v0.9.4

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract bundled editor & WebAssembly assets
        run: |
          curl -fSL "$UPSTREAM_BASE/ElixirOffice-0.9.4-x86_64.AppImage" -o upstream.AppImage
          chmod +x upstream.AppImage
          ./upstream.AppImage --appimage-extract
          rm -rf desktop/assets
          mv squashfs-root/resources/assets desktop/assets
          rm -rf squashfs-root upstream.AppImage

      - name: Prepare ieWorkspace branding & build identity
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node tools/desktop/prepare-ieworkspace-assets.mjs

      - name: Build Linux AppImage
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --linux AppImage --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: desktop/dist/ieWorkspace-*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract bundled editor & WebAssembly assets
        shell: pwsh
        run: |
          curl.exe -fSL "$env:UPSTREAM_BASE/ElixirOffice-0.9.4-win-x64.exe" -o upstream.exe
          7z x upstream.exe -oextract1 -y | Out-Null
          7z x extract1/`$PLUGINSDIR/app-64.7z -oextract2 -y | Out-Null
          if (Test-Path desktop/assets) { Remove-Item -Recurse -Force desktop/assets }
          Move-Item extract2/resources/assets desktop/assets
          Remove-Item -Recurse -Force extract1, extract2, upstream.exe

      - name: Prepare ieWorkspace branding & build identity
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node tools/desktop/prepare-ieworkspace-assets.mjs

      - name: Build Windows NSIS installer
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: desktop/dist/ieWorkspace-*-win-x64.exe

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract bundled editor & WebAssembly assets
        run: |
          curl -fSL "$UPSTREAM_BASE/ElixirOffice-0.9.4-mac-arm64.dmg" -o upstream.dmg
          hdiutil attach upstream.dmg -mountpoint /Volumes/upstream-eo -nobrowse -readonly
          rm -rf desktop/assets
          cp -R /Volumes/upstream-eo/*.app/Contents/Resources/assets desktop/assets
          hdiutil detach /Volumes/upstream-eo
          rm -f upstream.dmg

      - name: Generate round ieWorkspace macOS .icns icon
        run: |
          mkdir -p icon.iconset tools/desktop/artwork
          for s in 16 32 64 128 256 512; do
            sips -z $s $s desktop/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            s2=$((s * 2))
            sips -z $s2 $s2 desktop/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o tools/desktop/artwork/mac-icon.icns
          rm -rf icon.iconset

      - name: Prepare ieWorkspace branding & build identity
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node tools/desktop/prepare-ieworkspace-assets.mjs

      - name: Build macOS DMG
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --config ../tools/desktop/mac-config.cjs --mac dmg --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: desktop/dist/ieWorkspace-*-mac-arm64.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ieWorkspace-0.9.4-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: android/ieWorkspace-0.9.4-android.apk

  publish-release:
    needs: [build-linux, build-windows, build-macos, build-android]
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List built installers
        run: ls -lh release-files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.9.4' }}
          name: ieWorkspace ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v0.9.4' }}
          files: release-files/*
          make_latest: true
          generate_release_notes: true
