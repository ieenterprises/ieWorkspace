[program:ie-auth]
command=/usr/bin/python3 /var/www/elixiroffice/ieworkspace-auth/server.py
directory=/var/www/elixiroffice/ieworkspace-auth
user=ds
environment=IE_AUTH_PORT=3001,IE_AUTH_DATA_DIR=/var/www/elixiroffice/Data,IE_LOGIN_HTML=/var/www/elixiroffice/ieworkspace-auth/login.html
stdout_logfile=/var/log/elixiroffice/documentserver/ie-auth_out.log
stdout_logfile_backups=0
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/elixiroffice/documentserver/ie-auth_err.log
stderr_logfile_backups=0
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
