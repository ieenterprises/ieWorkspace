# ieWorkspace Auth & Clean Root "/" Routing (no /example/ in user URLs)

location = /ie-starting.html {
  alias /var/www/elixiroffice/ieworkspace-brand/starting.html;
  add_header Cache-Control "no-store";
}

# Auth service endpoints (Sign In / Sign Up / Logout / Session check)
location = /login {
  proxy_pass http://127.0.0.1:3001/login;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location = /signup {
  proxy_pass http://127.0.0.1:3001/signup;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /api/auth/ {
  proxy_pass http://127.0.0.1:3001;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location = /_ie_auth_check {
  internal;
  proxy_pass http://127.0.0.1:3001/api/auth/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Authorization $http_authorization;
}
location @ie_login_redirect {
  return 302 $the_scheme://$the_host/login?next=$request_uri;
}

# Brand assets & scripts (served at root /elixir/brand/... AND /example/elixir/brand/...)
location ~ ^(?:/example)?/elixir/brand/(logo\.svg|favicon\.svg|manifest\.webmanifest|icon-192\.png|icon-512\.png|icon-maskable-512\.png|download-menu\.js|ai-assistant\.js)$ {
  alias /var/www/elixiroffice/ieworkspace-brand/$1;
  add_header Cache-Control "no-cache";
}
# Badged ieWorkspace editor favicons (document-type icon + round company logo)
location ~ ^(?:/example)?/images/(word|cell|slide|pdf)\.ico$ {
  alias /var/www/elixiroffice/ieworkspace-brand/favicons/$1.ico;
  add_header Cache-Control "no-cache";
}

# Clean Root Home page "/" (requires Sign In, no /example/ in URL!)
location = / {
  auth_request /_ie_auth_check;
  error_page 401 = @ie_login_redirect;
  error_page 502 503 504 =200 /ie-starting.html;

  proxy_pass http://example/;
  proxy_intercept_errors on;

  proxy_set_header Accept-Encoding "";
  sub_filter "ElixirOffice" "ieWorkspace";
  sub_filter "</body>" '<script src="/elixir/brand/download-menu.js" defer></script><script src="/elixir/brand/ai-assistant.js" defer></script></body>';
  sub_filter_once off;

  proxy_set_header X-Forwarded-Host $the_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-Path "";
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Clean Root Editor page "/editor" (requires Sign In, no /example/ in URL!)
location = /editor {
  auth_request /_ie_auth_check;
  error_page 401 = @ie_login_redirect;
  error_page 502 503 504 =200 /ie-starting.html;

  proxy_pass http://example/editor;
  proxy_intercept_errors on;

  proxy_set_header Accept-Encoding "";
  sub_filter "ElixirOffice" "ieWorkspace";
  sub_filter "images/word.ico" "/images/word.ico?v=ie3";
  sub_filter "images/cell.ico" "/images/cell.ico?v=ie3";
  sub_filter "images/slide.ico" "/images/slide.ico?v=ie3";
  sub_filter "images/pdf.ico" "/images/pdf.ico?v=ie3";
  sub_filter "</body>" '<script src="/elixir/brand/download-menu.js" defer></script><script src="/elixir/brand/ai-assistant.js" defer></script></body>';
  sub_filter_once off;

  proxy_set_header X-Forwarded-Host $the_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-Path "";
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Root start-page static assets, file operations, and DocumentServer callbacks
location ~ ^/(elixir|elixir-local|images|javascripts|stylesheets|files|upload|download|convert|file|track|create|saveas|rename|history|reference|restore|csv)(/|$) {
  proxy_pass http://example;
  proxy_set_header X-Forwarded-Host $the_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-Path "";
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Redirect old /example/ bookmarks cleanly to root "/"
location = /example/ {
  return 302 $the_scheme://$the_host/;
}
location = /example {
  return 302 $the_scheme://$the_host/;
}

# Keep internal /example/* callbacks working for DocumentServer server-to-server downloads & saves
location /example/ {
  proxy_pass http://example/;
  proxy_intercept_errors on;
  error_page 502 503 504 =200 /ie-starting.html;

  proxy_set_header Accept-Encoding "";
  sub_filter "ElixirOffice" "ieWorkspace";
  sub_filter "images/word.ico" "/images/word.ico?v=ie3";
  sub_filter "images/cell.ico" "/images/cell.ico?v=ie3";
  sub_filter "images/slide.ico" "/images/slide.ico?v=ie3";
  sub_filter "images/pdf.ico" "/images/pdf.ico?v=ie3";
  sub_filter "</body>" '<script src="/elixir/brand/download-menu.js" defer></script><script src="/elixir/brand/ai-assistant.js" defer></script></body>';
  sub_filter_once off;

  proxy_set_header X-Forwarded-Host $the_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-Path /example;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ~ ^(\/welcome\/.*)$ {
  expires 365d;
  alias /var/www/elixiroffice/documentserver-example$1;
  index docker.html;
}
