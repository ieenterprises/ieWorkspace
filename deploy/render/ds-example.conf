location ~ ^(\/welcome\/.*)$ {
  expires 365d;
  alias /var/www/elixiroffice/documentserver-example$1;
  index docker.html;
}

# Exact-match overrides for ieWorkspace brand files so /example/elixir/brand/templates/* continues proxying normally
location = /example/elixir/brand/logo.svg {
  alias /var/www/elixiroffice/ieworkspace-brand/logo.svg;
  add_header Cache-Control "no-cache";
}
location = /example/elixir/brand/favicon.svg {
  alias /var/www/elixiroffice/ieworkspace-brand/favicon.svg;
  add_header Cache-Control "no-cache";
}
location = /example/elixir/brand/manifest.webmanifest {
  alias /var/www/elixiroffice/ieworkspace-brand/manifest.webmanifest;
  add_header Cache-Control "no-cache";
}
location = /example/elixir/brand/icon-192.png {
  alias /var/www/elixiroffice/ieworkspace-brand/icon-192.png;
  add_header Cache-Control "no-cache";
}
location = /example/elixir/brand/icon-512.png {
  alias /var/www/elixiroffice/ieworkspace-brand/icon-512.png;
  add_header Cache-Control "no-cache";
}
location = /example/elixir/brand/icon-maskable-512.png {
  alias /var/www/elixiroffice/ieworkspace-brand/icon-maskable-512.png;
  add_header Cache-Control "no-cache";
}
location = /example/elixir/brand/download-menu.js {
  alias /var/www/elixiroffice/ieworkspace-brand/download-menu.js;
  add_header Cache-Control "no-cache";
}

location /example/ {
  proxy_pass http://example/;
  proxy_intercept_errors on;
  error_page 502 503 504 /welcome/example-disabled.html;

  proxy_set_header Accept-Encoding "";
  sub_filter "ElixirOffice" "ieWorkspace";
  sub_filter "</body>" '<script src="elixir/brand/download-menu.js" defer></script></body>';
  sub_filter_once off;

  proxy_set_header X-Forwarded-Host $the_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-Path /example;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
