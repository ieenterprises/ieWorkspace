location ~ ^(\/welcome\/.*)$ {
  expires 365d;
  alias /var/www/elixiroffice/documentserver-example$1;
  index docker.html;
}

location /example/elixir/brand/ {
  alias /var/www/elixiroffice/ieworkspace-brand/;
  add_header Cache-Control "no-cache";
}

location /example/ {
  proxy_pass http://example/;
  proxy_intercept_errors on;
  error_page 502 503 504 /welcome/example-disabled.html;

  proxy_set_header Accept-Encoding "";
  sub_filter "ElixirOffice" "ieWorkspace";
  sub_filter_once off;

  proxy_set_header X-Forwarded-Host $the_host;
  proxy_set_header X-Forwarded-Proto $the_scheme;
  proxy_set_header X-Forwarded-Path /example;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
