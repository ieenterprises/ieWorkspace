<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starting ieWorkspace…</title>
  <link rel="icon" href="/example/elixir/brand/favicon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      color: #1d1d1f;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      text-align: center;
      background: #ffffff;
      padding: 40px 36px;
      border-radius: 16px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      width: 92%;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: contain;
      margin-bottom: 16px;
      border: 2px solid #e5e7eb;
      background: #fff;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 21px;
      font-weight: 600;
    }
    p {
      margin: 0 0 22px;
      font-size: 14px;
      color: #5b626b;
      line-height: 1.45;
    }
    .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto;
      border: 3px solid #e2eef6;
      border-top-color: #0082c9;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/example/elixir/brand/icon-192.png" alt="ieWorkspace" />
    <h1>Starting ieWorkspace…</h1>
    <p>Preparing your workspace. You will be taken straight into the application automatically in a few seconds.</p>
    <div class="spinner" aria-hidden="true"></div>
  </div>
  <script>
    (function check() {
      fetch('/healthcheck', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (t) {
          if (t && t.trim() === 'true') {
            window.location.replace('/example/');
          } else {
            setTimeout(check, 2500);
          }
        })
        .catch(function () { setTimeout(check, 2500); });
    })();
  </script>
</body>
</html>
